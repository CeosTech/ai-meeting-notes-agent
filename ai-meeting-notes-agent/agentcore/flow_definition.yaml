schemaVersion: 1.0
agent:
  name: MeetingNotesAgent
  description: An AI agent that ingests meeting recordings or transcripts, summarizes key points, and emails action items to participants in the desired language.
  model:
    provider: bedrock
    modelId: anthropic.claude-3-sonnet-20240229-v1:0
  instructions: |
    You are an expert AI assistant specialized in analyzing meeting transcripts.
    Your mission is to:
    1. Generate a clear and concise summary of the meeting.
    2. Extract key action items, decisions, and responsibilities.
    3. Ensure the tone is professional and direct.
  steps:
    - stepId: SummarizeAndSend
      type: api
      function: lambda:summarize_and_send
      description: Retrieves text/audio/video content from S3, transcribes when needed, summarizes with Bedrock, optionally translates, then emails the results to participants.

  outputs:
    - name: summary
      value: ${steps.SummarizeAndSend.output.summary}
    - name: message
      value: ${steps.SummarizeAndSend.output.message}
    - name: detected_language
      value: ${steps.SummarizeAndSend.output.detected_language}
    - name: final_language
      value: ${steps.SummarizeAndSend.output.final_language}
    - name: translation_applied
      value: ${steps.SummarizeAndSend.output.translation_applied}
    - name: target_language
      value: ${steps.SummarizeAndSend.output.target_language}
    - name: email_locale
      value: ${steps.SummarizeAndSend.output.email_locale}
